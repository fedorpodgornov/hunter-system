name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate signing key
        working-directory: android
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias system \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass systemtracker -keypass systemtracker \
              -dname "CN=SYSTEM Tracker, OU=App, O=Hunter, L=Moscow, C=RU"
          fi

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -l android/app/build/outputs/apk/release/
          cat android/app/build/outputs/apk/release/output-metadata.json || true

      - name: Publish APK into the repository
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk hunter-system.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hunter-system.apk android/keystore.jks
          git commit -m "Build Android APK [skip ci]" || echo "nothing to commit"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: hunter-system-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
